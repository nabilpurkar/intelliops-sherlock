# chart: kong/kong
# install: helm upgrade --install kong kong/kong -n kong --create-namespace -f kong-values.yaml
# Prerequisite: postgresql must be running in the database namespace.

ingressController:
  installCRDs: false

proxy:
  type: LoadBalancer
  annotations:
    kubernetes.io/ingress.class: alb
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: arn:aws:acm:us-east-1:007066145518:certificate/8f1d859b-5bdf-420d-a286-2bf7ea3ec3ef
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"

admin:
  enabled: true
  type: ClusterIP

env:
  database: postgres
  pg_host: postgresql.database.svc.cluster.local
  pg_port: "5432"
  pg_database: kong
  pg_user: kong
  pg_password: PLACEHOLDER_KONG_DB_PASS
