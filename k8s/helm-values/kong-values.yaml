# chart: kong/kong
# install: helm upgrade --install kong kong/kong -n kong --create-namespace -f kong-values.yaml
# Prerequisite: postgresql must be running in the database namespace.

ingressController:
  installCRDs: false

proxy:
  type: ClusterIP

admin:
  enabled: true
  type: ClusterIP

env:
  database: postgres
  pg_host: postgresql.database.svc.cluster.local
  pg_port: "5432"
  pg_database: kong
  pg_user: kong
  pg_password:
    valueFrom:
      secretKeyRef:
        name: postgresql-credentials
        key: kong-password
