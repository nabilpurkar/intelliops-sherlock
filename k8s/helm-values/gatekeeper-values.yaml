# chart: gatekeeper/gatekeeper version 3.22.2 (app v3.22.2)
# install: helm upgrade --install gatekeeper k8s/helm-charts/gatekeeper-3.22.2.tgz -n gatekeeper-system --create-namespace -f k8s/helm-values/gatekeeper-values.yaml

# Audit runs against existing resources to surface violations without blocking.
# Switch enforcementAction to "deny" in constraint specs to enforce.
auditInterval: 60

controllerManager:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

audit:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
