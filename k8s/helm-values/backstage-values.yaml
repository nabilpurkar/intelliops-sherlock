backstage:
  image:
    registry: ghcr.io
    repository: backstage/backstage
    tag: latest
    pullPolicy: IfNotPresent

  initContainers:
    - name: patch-notifications
      image: ghcr.io/backstage/backstage:latest
      imagePullPolicy: IfNotPresent
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      command: ["/bin/sh", "-c"]
      args:
        - |
          cp -a /app/packages/app/dist/static/. /shared-static/
          echo '' | base64 -d > /tmp/patch.js
          node /tmp/patch.js
      volumeMounts:
        - name: shared-static
          mountPath: /shared-static

  extraVolumes:
    - name: shared-static
      emptyDir: {}

  extraVolumeMounts:
    - name: shared-static
      mountPath: /app/packages/app/dist/static

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000

  containerSecurityContext:
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]

  extraEnvVars:
    - name: GITHUB_TOKEN
      valueFrom:
        secretKeyRef:
          name: backstage-github-token
          key: GITHUB_TOKEN
    - name: BACKSTAGE_DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: backstage-postgresql-secret
          key: postgresql-password
    - name: NODE_ENV
      value: production
    - name: LOG_LEVEL
      value: info

  appConfig:
    app:
      title: IntelliOps Sherlock
      baseUrl: https://backstage.infrastructurepath.online

    backend:
      baseUrl: https://backstage.infrastructurepath.online
      listen:
        port: 7007
        host: "0.0.0.0"
      csp:
        connect-src: ["'self'", "http:", "https:"]
      cors:
        origin: https://backstage.infrastructurepath.online
        methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
        credentials: true
      database:
        client: pg
        connection:
          host: postgresql.database.svc.cluster.local
          port: 5432
          user: backstage
          password:
            $env: BACKSTAGE_DB_PASSWORD
          database: backstage
          ssl: false
      auth:
        dangerouslyDisableDefaultAuthPolicy: true

    integrations:
      github:
        - host: github.com
          token: ${GITHUB_TOKEN}

    auth:
      environment: development
      providers: {}

    catalog:
      rules:
        - allow: [Component, API, Location, System, Domain, Resource]
      locations:
        - type: url
          target: https://github.com/nabilpurkar/intelliops-sherlock/blob/main/catalog-info.yaml
        - type: url
          target: https://github.com/nabilpurkar/intelliops-order-service/blob/main/catalog-info.yaml
        - type: url
          target: https://github.com/nabilpurkar/intelliops-payment-service/blob/main/catalog-info.yaml
        - type: url
          target: https://github.com/nabilpurkar/intelliops-inventory-service/blob/main/catalog-info.yaml
        - type: url
          target: https://github.com/nabilpurkar/intelliops-load-generator/blob/main/catalog-info.yaml

    kubernetes:
      serviceLocatorMethod:
        type: multiTenant
      clusterLocatorMethods:
        - type: config
          clusters:
            - url: https://kubernetes.default.svc
              name: intelliops-dev
              authProvider: serviceAccount
              skipTLSVerify: false
              skipMetricsLookup: false

    notifications:
      processors: {}

    techdocs:
      builder: local
      generator:
        runIn: local
      publisher:
        type: local

postgresql:
  enabled: false

ingress:
  enabled: false
