backstage:
  image:
    registry: ghcr.io
    repository: backstage/backstage
    tag: latest
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000

  containerSecurityContext:
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]

  extraEnvVars:
    - name: GITHUB_TOKEN
      valueFrom:
        secretKeyRef:
          name: backstage-github-token
          key: GITHUB_TOKEN
    - name: NODE_ENV
      value: production
    - name: LOG_LEVEL
      value: info

  appConfig:
    app:
      title: IntelliOps Sherlock
      baseUrl: https://backstage.infrastructurepath.online

    backend:
      baseUrl: https://backstage.infrastructurepath.online
      listen:
        port: 7007
        host: "0.0.0.0"
      csp:
        connect-src: ["'self'", "http:", "https:"]
      cors:
        origin: https://backstage.infrastructurepath.online
        methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
        credentials: true
      database:
        client: better-sqlite3
        connection: ":memory:"
      auth:
        dangerouslyDisableDefaultAuthPolicy: true

    integrations:
      github:
        - host: github.com
          token: ${GITHUB_TOKEN}

    auth:
      environment: development
      providers: {}

    catalog:
      rules:
        - allow: [Component, API, Location, System, Domain, Resource]
      locations:
        - type: url
          target: https://github.com/nabilpurkar/intelliops-sherlock/blob/main/catalog-info.yaml
        - type: url
          target: https://github.com/nabilpurkar/intelliops-order-service/blob/main/catalog-info.yaml
        - type: url
          target: https://github.com/nabilpurkar/intelliops-payment-service/blob/main/catalog-info.yaml
        - type: url
          target: https://github.com/nabilpurkar/intelliops-inventory-service/blob/main/catalog-info.yaml
        - type: url
          target: https://github.com/nabilpurkar/intelliops-load-generator/blob/main/catalog-info.yaml

    kubernetes:
      serviceLocatorMethod:
        type: multiTenant
      clusterLocatorMethods:
        - type: config
          clusters:
            - url: https://kubernetes.default.svc
              name: intelliops-dev
              authProvider: serviceAccount
              skipTLSVerify: false
              skipMetricsLookup: false

    techdocs:
      builder: local
      generator:
        runIn: local
      publisher:
        type: local

postgresql:
  enabled: false

ingress:
  enabled: false
