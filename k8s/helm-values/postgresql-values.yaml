# chart: bitnami/postgresql version 18.6.7
# install: helm upgrade --install postgresql bitnami/postgresql --version 18.6.7 -n database --create-namespace -f postgresql-values.yaml

auth:
  username: postgres
  existingSecret: postgresql-credentials
  secretKeys:
    adminPasswordKey: postgres-password
  database: postgres

primary:
  initdb:
    scriptsSecret: postgresql-initdb-scripts
  persistence:
    enabled: true
    size: 10Gi
    storageClass: gp2

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
