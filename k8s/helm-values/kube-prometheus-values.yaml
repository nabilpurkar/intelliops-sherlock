# chart: prometheus-community/kube-prometheus-stack version 85.3.3
# install: helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack --version 85.3.3 -n monitoring --create-namespace -f kube-prometheus-values.yaml

grafana:
  admin:
    existingSecret: grafana-credentials
    userKey: admin-user
    passwordKey: admin-password
  ingress:
    enabled: false

  # Sidecar watches for ConfigMaps with label grafana_dashboard=1 in all namespaces
  # and auto-provisions them into Grafana. This powers k8s/grafana/dashboard-*.yaml
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true

  # Additional datasources — Loki for logs, Tempo for traces
  additionalDataSources:
    - name: Loki
      type: loki
      uid: Loki
      url: http://loki.monitoring.svc.cluster.local:3100
      access: proxy
      isDefault: false
      jsonData:
        maxLines: 1000
        derivedFields:
          - datasourceUid: Tempo
            matcherRegex: "traceId=(\\w+)"
            name: TraceID
            url: "$${__value.raw}"
            type: dataLink
    - name: Tempo
      type: tempo
      uid: Tempo
      url: http://tempo.monitoring.svc.cluster.local:3200
      access: proxy
      isDefault: false
      jsonData:
        tracesToLogs:
          datasourceUid: Loki
          spanStartTimeShift: "-1h"
          spanEndTimeShift: "1h"
          filterByTraceID: true
        serviceMap:
          datasourceUid: prometheus
        nodeGraph:
          enabled: true
        search:
          hide: false
        lokiSearch:
          datasourceUid: Loki

prometheus:
  prometheusSpec:
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          resources:
            requests:
              storage: 20Gi

alertmanager:
  enabled: true

nodeExporter:
  enabled: true
