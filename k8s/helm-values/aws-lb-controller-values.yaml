# chart: eks/aws-load-balancer-controller version 3.3.0
# install: helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller --version 3.3.0 -n kube-system -f aws-lb-controller-values.yaml

clusterName: intelliops-dev
region: us-east-1
# vpcId is injected dynamically by install-stack.sh via --set vpcId=...
# (reads from 'aws eks describe-cluster' so it never needs hardcoding)

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::007066145518:role/intelliops-dev-alb-controller-role

# enableManageBackendSecurityGroupRules is disabled: the node ENI has two cluster-tagged SGs
# (our custom node SG + EKS-managed cluster SG), which causes the controller to error with
# "expected exactly one securityGroup tagged with kubernetes.io/cluster/<name>".
# ALB-to-pod connectivity is handled by aws_security_group_rule.node_ingress_vpc in
# terraform/modules/eks/main.tf (VPC CIDR rule — no bootstrapping dependency on ALB SG ID).
enableManageBackendSecurityGroupRules: false
