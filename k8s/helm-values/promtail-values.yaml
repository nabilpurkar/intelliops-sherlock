# chart: grafana/promtail 6.17.1 (Promtail v3.5.1)
# install: helm upgrade --install promtail grafana/promtail --version 6.17.1 -n monitoring --create-namespace -f promtail-values.yaml

config:
  clients:
    - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push

resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "200m"
    memory: "256Mi"

serviceMonitor:
  enabled: false
