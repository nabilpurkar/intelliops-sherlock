# chart: grafana/loki 7.0.0 (Loki v3.6.7)
# install: helm upgrade --install loki grafana/loki --version 7.0.0 -n monitoring --create-namespace -f loki-values.yaml

deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  storage:
    type: filesystem

  limits_config:
    volume_enabled: true
    allow_structured_metadata: true
    reject_old_samples: true
    reject_old_samples_max_age: 168h

  server:
    http_listen_port: 3100
    grpc_listen_port: 9095

singleBinary:
  replicas: 1
  persistence:
    enabled: false
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  extraVolumes:
    - name: data
      emptyDir: {}
    - name: rules
      emptyDir: {}
  extraVolumeMounts:
    - name: data
      mountPath: /var/loki
    - name: rules
      mountPath: /rules

# Disable distributed components (single binary handles everything)
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Disable optional components that lack resource limits (blocked by Kyverno in dev)
gateway:
  enabled: false

lokiCanary:
  enabled: false

# Disable the k8s-sidecar rules injector (no resource limits in chart defaults)
sidecar:
  rules:
    enabled: false

# Disable memcached caches — not needed for dev single-binary mode
chunksCache:
  enabled: false

resultsCache:
  enabled: false

# Disable bundled monitoring — we use kube-prometheus-stack
monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  serviceMonitor:
    enabled: false

test:
  enabled: false

# Promtail is deployed separately via grafana/promtail chart
promtail:
  enabled: false

grafana:
  enabled: false
