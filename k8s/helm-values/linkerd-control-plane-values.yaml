# chart: linkerd/linkerd-control-plane version 1.16.11
# install: managed by install-stack.sh (step 10)
# Prerequisite: linkerd-crds must be installed first.
#
# identityTrustAnchorsPEM is NOT stored here — injected at install time by
# install-stack.sh via --set-string, reading ca_crt_b64 from:
#   AWS Secrets Manager: intelliops/dev/linkerd  (key: ca_crt_b64)
# The SM secret is auto-generated by install-stack.sh step 0 if absent.
# No certificates or keys live in this file.

controllerLogLevel: info

identity:
  issuer:
    # scheme: kubernetes.io/tls — Linkerd reads the issuer key+cert from a pre-created
    # Kubernetes Secret named 'linkerd-identity-issuer' in the 'linkerd' namespace.
    # install-stack.sh step 9b creates that secret from SM (keys: issuer_crt_b64, issuer_key_b64).
    scheme: kubernetes.io/tls

proxyInit:
  runAsRoot: true
