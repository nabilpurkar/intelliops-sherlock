# chart: sonarqube/sonarqube
# install: helm upgrade --install sonarqube sonarqube/sonarqube -n sonarqube --create-namespace -f sonarqube-values.yaml
# Prerequisite: postgresql must be running in the database namespace.

community:
  enabled: true

monitoringPasscode: "intelliops-monitoring-2026"

persistence:
  enabled: false

service:
  type: ClusterIP

resources:
  requests:
    cpu: 200m
    memory: 1Gi
  limits:
    cpu: 800m
    memory: 2Gi

postgresql:
  enabled: false

jdbcOverwrite:
  enabled: true
  jdbcUrl: jdbc:postgresql://postgresql.database.svc.cluster.local:5432/sonarqube
  jdbcUsername: sonarqube
  jdbcSecretName: postgresql-credentials
  jdbcSecretPasswordKey: sonarqube-password
