portal:
  frontend:
    service:
      type: ClusterIP

  server:
    service:
      type: ClusterIP

    authServer:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi

    graphqlServer:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi

# Use existing secret from AWS Secrets Manager via ExternalSecrets
existingSecret: litmus-mongodb-secret

mongodb:
  replicaCount: 1
  architecture: standalone
  persistence:
    storageClass: gp2
    size: 5Gi
  auth:
    # Credentials come from a k8s Secret created by install-stack.sh from
    # AWS Secrets Manager (intelliops/dev/litmus) — nothing hardcoded here.
    existingSecret: litmus-mongodb-secret
  volumePermissions:
    enabled: true
  arbiter:
    enabled: false

adminConfig:
  DBUSER: "admin"
  DB_PORT: "27017"
