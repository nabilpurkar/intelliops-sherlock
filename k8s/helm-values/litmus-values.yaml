portal:
  frontend:
    service:
      type: ClusterIP

  server:
    service:
      type: ClusterIP

    authServer:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi

    graphqlServer:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi

mongo:
  resources:
    requests:
      cpu: 50m
      memory: 300Mi
    limits:
      cpu: 250m
      memory: 600Mi
  persistence:
    size: 5Gi

mongodb:
  replicaCount: 1
  image:
    registry: 007066145518.dkr.ecr.us-east-1.amazonaws.com
    repository: intelliops-dev/mongodb
    tag: "5.0"
  persistence:
    storageClass: gp2
    size: 5Gi
  auth:
    # Credentials come from a k8s Secret created by install-stack.sh from
    # AWS Secrets Manager (intelliops/dev/litmus) — nothing hardcoded here.
    existingSecret: litmus-mongodb-secret
  volumePermissions:
    enabled: false
  arbiter:
    enabled: false

adminConfig:
  DBUSER: "admin"
  DB_PORT: "27017"
  # DB_SERVER intentionally not set — chart template generates correct URI:
  # mongodb://litmus-mongodb-0.litmus-mongodb-headless:27017/admin
