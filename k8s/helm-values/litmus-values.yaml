portal:
  frontend:
    service:
      type: ClusterIP

  server:
    service:
      type: ClusterIP

    authServer:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi

    graphqlServer:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi

mongo:
  resources:
    requests:
      cpu: 50m
      memory: 300Mi
    limits:
      cpu: 250m
      memory: 600Mi
  persistence:
    size: 5Gi

adminConfig:
  DBUSER: "admin"
  DBPASSWORD: "litmus"
  DB_SERVER: "mongo-service"
  DB_PORT: "27017"
