# chart: opencost/opencost
# repo:  https://opencost.github.io/opencost-helm-chart
# install: helm upgrade --install opencost opencost/opencost -n monitoring -f opencost-values.yaml

opencost:
  exporter:
    defaultClusterId: intelliops-dev
    resources:
      requests:
        cpu: 10m
        memory: 55Mi
      limits:
        cpu: 100m
        memory: 256Mi

  # Chart helper reads opencost.prometheus.external, NOT opencost.exporter.prometheus
  prometheus:
    internal:
      enabled: false
    external:
      enabled: true
      url: "http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"

  ui:
    enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 55Mi
      limits:
        cpu: 100m
        memory: 256Mi
    ingress:
      enabled: false

  metrics:
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: prometheus

  # Grafana dashboard auto-provisioned via ConfigMap (grafana_dashboard=1)
  grafana:
    dashboardsConfigMaps:
      enabled: false  # we provision via k8s/grafana/dashboard-cost.yaml instead
