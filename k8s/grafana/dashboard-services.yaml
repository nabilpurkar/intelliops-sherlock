---
# Services Overview Dashboard
# Picked up automatically by the Grafana sidecar (label: grafana_dashboard=1)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-services
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "IntelliOps"
data:
  services-overview.json: |
    {
      "id": null,
      "uid": "intelliops-services",
      "title": "Services Overview",
      "tags": ["intelliops", "services"],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Order Service — Availability (1h)",
          "gridPos": {"x": 0, "y": 0, "w": 4, "h": 4},
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {"mode": "absolute", "steps": [
                {"color": "red", "value": null},
                {"color": "yellow", "value": 0.99},
                {"color": "green", "value": 0.999}
              ]},
              "mappings": []
            }
          },
          "targets": [{"expr": "slo:order_service:availability_rate1h", "instant": true, "legendFormat": ""}]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Payment Service — Availability (1h)",
          "gridPos": {"x": 4, "y": 0, "w": 4, "h": 4},
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {"mode": "absolute", "steps": [
                {"color": "red", "value": null},
                {"color": "yellow", "value": 0.99},
                {"color": "green", "value": 0.999}
              ]},
              "mappings": []
            }
          },
          "targets": [{"expr": "slo:payment_service:availability_rate1h", "instant": true, "legendFormat": ""}]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Inventory Service — Availability (1h)",
          "gridPos": {"x": 8, "y": 0, "w": 4, "h": 4},
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {"mode": "absolute", "steps": [
                {"color": "red", "value": null},
                {"color": "yellow", "value": 0.99},
                {"color": "green", "value": 0.999}
              ]},
              "mappings": []
            }
          },
          "targets": [{"expr": "slo:inventory_service:availability_rate1h", "instant": true, "legendFormat": ""}]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Active Orders",
          "gridPos": {"x": 12, "y": 0, "w": 4, "h": 4},
          "fieldConfig": {"defaults": {"unit": "short", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}}},
          "targets": [{"expr": "orders_active_total", "instant": true, "legendFormat": ""}]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Request Rate — all services (req/s)",
          "gridPos": {"x": 0, "y": 4, "w": 12, "h": 8},
          "fieldConfig": {"defaults": {"unit": "reqps"}},
          "targets": [
            {"expr": "sum(rate(order_requests_total[2m]))", "legendFormat": "order-service"},
            {"expr": "sum(rate(payment_requests_total[2m]))", "legendFormat": "payment-service"},
            {"expr": "sum(rate(inventory_requests_total[2m]))", "legendFormat": "inventory-service"}
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Error Rate — all services (%)",
          "gridPos": {"x": 12, "y": 4, "w": 12, "h": 8},
          "fieldConfig": {"defaults": {"unit": "percentunit", "custom": {"thresholdsStyle": {"mode": "area"}}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 0.001}, {"color": "red", "value": 0.01}]}}},
          "targets": [
            {"expr": "slo:order_service:error_rate5m", "legendFormat": "order-service"},
            {"expr": "slo:payment_service:error_rate5m", "legendFormat": "payment-service"},
            {"expr": "slo:inventory_service:error_rate5m", "legendFormat": "inventory-service"}
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "P95 Latency — all services (s)",
          "gridPos": {"x": 0, "y": 12, "w": 12, "h": 8},
          "fieldConfig": {"defaults": {"unit": "s", "custom": {"thresholdsStyle": {"mode": "area"}}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 0.3}, {"color": "red", "value": 0.5}]}}},
          "targets": [
            {"expr": "slo:order_service:latency_p95_5m", "legendFormat": "order-service"},
            {"expr": "slo:payment_service:latency_p95_5m", "legendFormat": "payment-service"},
            {"expr": "slo:inventory_service:latency_p95_5m", "legendFormat": "inventory-service"}
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Orders Created / minute",
          "gridPos": {"x": 12, "y": 12, "w": 12, "h": 8},
          "fieldConfig": {"defaults": {"unit": "short"}},
          "targets": [
            {"expr": "rate(orders_created_total{status=\"success\"}[2m]) * 60", "legendFormat": "success"},
            {"expr": "rate(orders_created_total{status=\"failed\"}[2m]) * 60", "legendFormat": "failed"}
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "DB Query Latency P95 — order-service",
          "gridPos": {"x": 0, "y": 20, "w": 12, "h": 8},
          "fieldConfig": {"defaults": {"unit": "s"}},
          "targets": [
            {"expr": "histogram_quantile(0.95, sum(rate(db_query_duration_seconds_bucket[5m])) by (le, query_type))", "legendFormat": "{{ query_type }}"}
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Error Types — order-service",
          "gridPos": {"x": 12, "y": 20, "w": 12, "h": 8},
          "fieldConfig": {"defaults": {"unit": "short"}},
          "targets": [
            {"expr": "rate(order_errors_total[2m])", "legendFormat": "{{ error_type }}"}
          ]
        }
      ]
    }
