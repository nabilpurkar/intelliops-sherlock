---
# ServiceMonitor — scrape Kyverno admission controller + background controller metrics
# Kyverno exposes metrics on port 8000 via separate ClusterIP services
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kyverno
  namespace: monitoring
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - kyverno
  selector:
    matchExpressions:
      - key: app.kubernetes.io/part-of
        operator: In
        values: [kyverno]
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
