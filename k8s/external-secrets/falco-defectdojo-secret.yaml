# Syncs the DefectDojo API v2 token into the falco namespace so falcosidekick
# can post runtime findings to DefectDojo automatically.
#
# Prerequisite: after first DefectDojo login, go to Profile → API v2 Key,
# copy the token, then store it in AWS Secrets Manager:
#   aws secretsmanager put-secret-value \
#     --secret-id intelliops/dev/defectdojo \
#     --secret-string '{"api_key":"<your-token>","admin_password":"...","secret_key":"...","credential_aes256_key":"...","metrics_http_auth_password":"...","valkey_password":"..."}'

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: falco-defectdojo-apikey
  namespace: falco
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: falco-defectdojo-apikey
    creationPolicy: Owner
  data:
    - secretKey: api_key
      remoteRef:
        key: intelliops/dev/defectdojo
        property: api_key
