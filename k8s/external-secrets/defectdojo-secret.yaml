# DefectDojo requires 3 separate k8s secrets with specific names:
#   1. defectdojo                     — Django secret key, AES key, admin password, metrics password
#   2. defectdojo-postgresql-specific — shared postgresql defectdojo user password (from intelliops/dev/postgresql)
#   3. defectdojo-valkey-specific     — bundled valkey (redis) password (from intelliops/dev/defectdojo)

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: defectdojo-main
  namespace: defectdojo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: defectdojo
    creationPolicy: Owner
  data:
    - secretKey: DD_ADMIN_PASSWORD
      remoteRef:
        key: intelliops/dev/defectdojo
        property: admin_password
    - secretKey: DD_SECRET_KEY
      remoteRef:
        key: intelliops/dev/defectdojo
        property: secret_key
    - secretKey: DD_CREDENTIAL_AES_256_KEY
      remoteRef:
        key: intelliops/dev/defectdojo
        property: credential_aes256_key
    - secretKey: METRICS_HTTP_AUTH_PASSWORD
      remoteRef:
        key: intelliops/dev/defectdojo
        property: metrics_http_auth_password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: defectdojo-postgresql
  namespace: defectdojo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: defectdojo-postgresql-specific
    creationPolicy: Owner
  data:
    - secretKey: postgresql-password
      remoteRef:
        key: intelliops/dev/postgresql
        property: defectdojo_password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: defectdojo-valkey
  namespace: defectdojo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: defectdojo-valkey-specific
    creationPolicy: Owner
  data:
    - secretKey: valkey-password
      remoteRef:
        key: intelliops/dev/defectdojo
        property: valkey_password
