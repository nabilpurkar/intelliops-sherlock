# ─────────────────────────────────────────────────────────────────────────────
# Namespace
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: aiops-demo
  labels:
    name: aiops-demo

---
# ─────────────────────────────────────────────────────────────────────────────
# ServiceAccount
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiops-demo-sa
  namespace: aiops-demo

---
# ─────────────────────────────────────────────────────────────────────────────
# order-service  (ClusterIP)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: aiops-demo
  labels:
    app: order-service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port:   "8000"
    prometheus.io/path:   "/metrics"
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - name: http
      port:       8000
      targetPort: 8000
      protocol:   TCP

---
# Headless service — for direct pod addressing (e.g. StatefulSet / DNS discovery)
apiVersion: v1
kind: Service
metadata:
  name: order-service-headless
  namespace: aiops-demo
  labels:
    app: order-service
spec:
  clusterIP: None
  selector:
    app: order-service
  ports:
    - name: http
      port:       8000
      targetPort: 8000

---
# ─────────────────────────────────────────────────────────────────────────────
# payment-service  (ClusterIP)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: aiops-demo
  labels:
    app: payment-service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port:   "8002"
    prometheus.io/path:   "/metrics"
spec:
  type: ClusterIP
  selector:
    app: payment-service
  ports:
    - name: http
      port:       8002
      targetPort: 8002
      protocol:   TCP

---
apiVersion: v1
kind: Service
metadata:
  name: payment-service-headless
  namespace: aiops-demo
  labels:
    app: payment-service
spec:
  clusterIP: None
  selector:
    app: payment-service
  ports:
    - name: http
      port:       8002
      targetPort: 8002

---
# ─────────────────────────────────────────────────────────────────────────────
# inventory-service  (ClusterIP)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: aiops-demo
  labels:
    app: inventory-service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port:   "8001"
    prometheus.io/path:   "/metrics"
spec:
  type: ClusterIP
  selector:
    app: inventory-service
  ports:
    - name: http
      port:       8001
      targetPort: 8001
      protocol:   TCP

---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service-headless
  namespace: aiops-demo
  labels:
    app: inventory-service
spec:
  clusterIP: None
  selector:
    app: inventory-service
  ports:
    - name: http
      port:       8001
      targetPort: 8001

---
# ─────────────────────────────────────────────────────────────────────────────
# load-generator  (ClusterIP — exposes Locust web UI internally)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: load-generator
  namespace: aiops-demo
  labels:
    app: load-generator
spec:
  type: ClusterIP
  selector:
    app: load-generator
  ports:
    - name: web-ui
      port:       8089
      targetPort: 8089
      protocol:   TCP
