apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: aiops-demo
  labels:
    app: payment-service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port:   "8002"
    prometheus.io/path:   "/metrics"
spec:
  type: ClusterIP
  selector:
    app: payment-service
  ports:
    - name: http
      port:       8002
      targetPort: 8002
      protocol:   TCP

---
apiVersion: v1
kind: Service
metadata:
  name: payment-service-headless
  namespace: aiops-demo
  labels:
    app: payment-service
spec:
  clusterIP: None
  selector:
    app: payment-service
  ports:
    - name: http
      port:       8002
      targetPort: 8002
