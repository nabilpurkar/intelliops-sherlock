apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: aiops-demo
  labels:
    app: order-service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port:   "8000"
    prometheus.io/path:   "/metrics"
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - name: http
      port:       8000
      targetPort: 8000
      protocol:   TCP

---
apiVersion: v1
kind: Service
metadata:
  name: order-service-headless
  namespace: aiops-demo
  labels:
    app: order-service
spec:
  clusterIP: None
  selector:
    app: order-service
  ports:
    - name: http
      port:       8000
      targetPort: 8000
