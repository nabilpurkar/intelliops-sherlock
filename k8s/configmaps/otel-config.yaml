# ─────────────────────────────────────────────────────────────────────────────
# App environment config — OTEL endpoint, shared across all services
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: aiops-demo
data:
  # Point to your OpenTelemetry Collector service (install via Helm separately)
  # helm install otel-collector open-telemetry/opentelemetry-collector \
  #   --namespace monitoring --values helm-values/otel-collector-values.yaml
  OTEL_ENDPOINT: "http://otel-collector.monitoring.svc.cluster.local:4317"

---
# ─────────────────────────────────────────────────────────────────────────────
# OpenTelemetry Collector pipeline configuration
# Deploy this as a values override for the OTEL Helm chart
# Reference: https://opentelemetry.io/docs/collector/configuration/
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-pipeline
  namespace: monitoring
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4318"

      # Scrape Prometheus /metrics endpoints from all aiops-demo pods
      prometheus:
        config:
          scrape_configs:
            - job_name: "aiops-services"
              kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names: ["aiops-demo"]
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                  action: keep
                  regex: "true"
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                  action: replace
                  target_label: __metrics_path__
                  regex: (.+)
                - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
                  action: replace
                  regex: ([^:]+)(?::\d+)?;(\d+)
                  replacement: $$1:$$2
                  target_label: __address__
                - action: labelmap
                  regex: __meta_kubernetes_pod_label_(.+)
                - source_labels: [__meta_kubernetes_namespace]
                  action: replace
                  target_label: namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  action: replace
                  target_label: pod

    processors:
      # Batch for performance
      batch:
        timeout:    1s
        send_batch_size: 1024

      # Add K8s metadata to all signals
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        filter:
          node_from_env_var: KUBE_NODE_NAME
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.namespace.name
            - k8s.node.name
            - k8s.pod.start_time

      # Memory limiter — prevents OOM on collector
      memory_limiter:
        check_interval:         1s
        limit_mib:              512
        spike_limit_mib:        128

      # Add resource attributes
      resource:
        attributes:
          - key:    environment
            value:  production
            action: upsert
          - key:    cluster
            value:  aiops-demo-eks
            action: upsert

    exporters:
      # Metrics → Prometheus (remote write)
      prometheusremotewrite:
        endpoint: "http://prometheus-server.monitoring.svc.cluster.local:9090/api/v1/write"

      # Traces → Tempo
      otlp/tempo:
        endpoint: "http://tempo.monitoring.svc.cluster.local:4317"
        tls:
          insecure: true

      # Logs → Loki
      loki:
        endpoint: "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        default_labels_enabled:
          exporter: false
          job:      true
          instance: true
          level:    true

      # Debug (disable in prod)
      # logging:
      #   verbosity: detailed

    service:
      pipelines:
        traces:
          receivers:  [otlp]
          processors: [memory_limiter, k8sattributes, resource, batch]
          exporters:  [otlp/tempo]

        metrics:
          receivers:  [otlp, prometheus]
          processors: [memory_limiter, k8sattributes, resource, batch]
          exporters:  [prometheusremotewrite]

        logs:
          receivers:  [otlp]
          processors: [memory_limiter, k8sattributes, resource, batch]
          exporters:  [loki]
