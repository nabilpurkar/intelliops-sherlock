apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: microservices
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.io
  labels:
    app.kubernetes.io/part-of: intelliops
spec:
  project: intelliops

  source:
    repoURL: https://github.com/nabilpurkar/intelliops-sherlock.git
    targetRevision: main
    path: k8s/apps

  destination:
    server: https://kubernetes.default.svc
    namespace: apps

  syncPolicy:
    automated:
      prune: true      # remove resources deleted from git
      selfHeal: true   # revert manual cluster changes
    syncOptions:
      - CreateNamespace=false          # namespace pre-created by install-stack.sh
      - ApplyOutOfSyncOnly=true        # skip already-synced resources
      - ServerSideApply=true           # avoids annotation size limit on large objects
      - SkipDryRunOnMissingResource=true  # tolerate CRDs not yet installed (ServiceMonitor, Instrumentation)
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  revisionHistoryLimit: 5

  # Ignore HPA-managed replica count — HPA overrides .spec.replicas at runtime;
  # ArgoCD must not revert it back to the git value.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
