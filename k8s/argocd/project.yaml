apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: intelliops
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.io
spec:
  description: IntelliOps Sherlock — AIOps demo platform

  sourceRepos:
    - https://github.com/nabilpurkar/intelliops-sherlock.git
    # External Helm repos for non-vendored charts
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
    - https://open-telemetry.github.io/opentelemetry-helm-charts
    - https://falcosecurity.github.io/charts
    - https://backstage.github.io/charts
    - https://litmuschaos.github.io/litmus-helm
    - https://opencost.github.io/opencost-helm-chart
    - https://kyverno.github.io/kyverno/
    - '*'   # allow vendored charts from the same repo by wildcard

  destinations:
    - server: https://kubernetes.default.svc
      namespace: apps
    - server: https://kubernetes.default.svc
      namespace: locust
    - server: https://kubernetes.default.svc
      namespace: aiops-demo
    - server: https://kubernetes.default.svc
      namespace: monitoring
    - server: https://kubernetes.default.svc
      namespace: falco
    - server: https://kubernetes.default.svc
      namespace: kyverno
    - server: https://kubernetes.default.svc
      namespace: sonarqube
    - server: https://kubernetes.default.svc
      namespace: defectdojo
    - server: https://kubernetes.default.svc
      namespace: backstage
    - server: https://kubernetes.default.svc
      namespace: litmus
    - server: https://kubernetes.default.svc
      namespace: kong
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: external-secrets
    - server: https://kubernetes.default.svc
      namespace: external-dns
    - server: https://kubernetes.default.svc
      namespace: database
    - server: https://kubernetes.default.svc
      namespace: linkerd
    - server: https://kubernetes.default.svc
      namespace: argocd

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRole
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRoleBinding
    - group: "apiextensions.k8s.io"
      kind: CustomResourceDefinition
    - group: "admissionregistration.k8s.io"
      kind: ValidatingWebhookConfiguration
    - group: "admissionregistration.k8s.io"
      kind: MutatingWebhookConfiguration
    - group: "policy"
      kind: PodSecurityPolicy
    - group: "kyverno.io"
      kind: "*"
    - group: "monitoring.coreos.com"
      kind: "*"
    - group: "litmuschaos.io"
      kind: "*"
    - group: "storage.k8s.io"
      kind: StorageClass
    - group: "networking.k8s.io"
      kind: IngressClass
    - group: "cert-manager.io"
      kind: "*"

  namespaceResourceWhitelist:
    - group: "apps"
      kind: Deployment
    - group: "apps"
      kind: StatefulSet
    - group: "apps"
      kind: DaemonSet
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: PersistentVolumeClaim
    - group: ""
      kind: Pod
    - group: "autoscaling"
      kind: HorizontalPodAutoscaler
    - group: "batch"
      kind: CronJob
    - group: "batch"
      kind: Job
    - group: "rbac.authorization.k8s.io"
      kind: Role
    - group: "rbac.authorization.k8s.io"
      kind: RoleBinding
    - group: "monitoring.coreos.com"
      kind: "*"
    - group: "networking.k8s.io"
      kind: NetworkPolicy
    - group: "networking.k8s.io"
      kind: Ingress
    - group: "policy"
      kind: PodDisruptionBudget
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
    - group: "kyverno.io"
      kind: "*"
    - group: "litmuschaos.io"
      kind: "*"
    - group: "cert-manager.io"
      kind: "*"
    - group: "opentelemetry.io"
      kind: "*"

  roles:
    - name: ci-deployer
      description: CI/CD pipeline role — sync and get applications only
      policies:
        - p, proj:intelliops:ci-deployer, applications, sync, intelliops/*, allow
        - p, proj:intelliops:ci-deployer, applications, get, intelliops/*, allow
      jwtTokens: []
