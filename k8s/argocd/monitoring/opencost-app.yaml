apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opencost
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: intelliops
  source:
    repoURL: https://opencost.github.io/opencost-helm-chart
    chart: opencost
    targetRevision: "1.43.0"
    helm:
      valuesObject:
        opencost:
          prometheus:
            external:
              enabled: true
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          ui:
            enabled: true
          resources:
            requests:
              cpu: 10m
              memory: 55Mi
            limits:
              cpu: 999m
              memory: 1Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
