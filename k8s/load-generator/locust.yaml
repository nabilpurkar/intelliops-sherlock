---
apiVersion: v1
kind: ConfigMap
metadata:
  name: locust-config
  namespace: locust
data:
  HOST: "http://order-service.apps.svc.cluster.local:8000"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: locustfile
  namespace: locust
data:
  locustfile.py: |
    from locust import HttpUser, task, between
    import random

    PRODUCTS = ["widget-a", "widget-b", "widget-c", "gadget-x"]

    class ShopUser(HttpUser):
        wait_time = between(1, 3)

        @task(3)
        def list_orders(self):
            self.client.get("/orders", name="/orders")

        @task(5)
        def create_order(self):
            self.client.post("/orders", json={
                "product_id": random.choice(PRODUCTS),
                "quantity": random.randint(1, 5)
            }, name="/orders [POST]")

        @task(2)
        def check_inventory(self):
            self.client.get(
                f"http://inventory-service.apps.svc.cluster.local:8000/inventory/{random.choice(PRODUCTS)}",
                name="/inventory/:id"
            )

        @task(1)
        def health_check(self):
            self.client.get("/healthz", name="/healthz")

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust
  namespace: locust
  labels:
    app: locust
spec:
  replicas: 1
  selector:
    matchLabels:
      app: locust
  template:
    metadata:
      labels:
        app: locust
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: locust
          image: 007066145518.dkr.ecr.us-east-1.amazonaws.com/intelliops-dev/load-generator:latest
          ports:
            - containerPort: 8089
              name: web
          env:
            - name: LOCUST_HOST
              valueFrom:
                configMapKeyRef:
                  name: locust-config
                  key: HOST
          args:
            - locust
            - --locustfile
            - /home/locust/locustfile/locustfile.py
            - --host
            - $(LOCUST_HOST)
            - --web-host
            - "0.0.0.0"
            - --web-port
            - "8089"
          volumeMounts:
            - name: locustfile
              mountPath: /home/locust/locustfile
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          livenessProbe:
            httpGet:
              path: /
              port: 8089
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 8089
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: locustfile
          configMap:
            name: locustfile

---
apiVersion: v1
kind: Service
metadata:
  name: locust
  namespace: locust
  labels:
    app: locust
spec:
  selector:
    app: locust
  ports:
    - port: 8089
      targetPort: 8089
      name: web
