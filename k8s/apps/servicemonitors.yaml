---
# ServiceMonitors for microservices — Prometheus scrapes /metrics on each service port
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: order-service
  namespace: apps
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames: [apps]
  selector:
    matchLabels:
      app: order-service
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
