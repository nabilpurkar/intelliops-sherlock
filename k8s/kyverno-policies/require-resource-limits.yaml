apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Require Resource Limits
    policies.kyverno.io/category: Best Practices / BFSI
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Resource limits prevent noisy-neighbour DoS — required for RBI IT Security
      Framework availability controls and multi-tenant cluster stability.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-limits
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces:
                - apps
                - monitoring
                - defectdojo
                - sonarqube
      validate:
        message: "CPU and memory limits are required."
        pattern:
          spec:
            containers:
              - resources:
                  limits:
                    memory: "?*"
                    cpu: "?*"
