apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag
    policies.kyverno.io/category: Best Practices / BFSI
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Mutable tags like 'latest' break supply chain traceability. Required for
      SLSA provenance and PCI-DSS 6.3.2 software inventory controls.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces:
                - apps
      validate:
        message: "Image tag 'latest' is not allowed in the apps namespace. Use a specific SHA or version tag."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
