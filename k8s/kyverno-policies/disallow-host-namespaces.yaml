apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-host-namespaces
  annotations:
    policies.kyverno.io/title: Disallow Host Namespaces
    policies.kyverno.io/category: Pod Security / BFSI
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Pods must not use hostNetwork, hostPID, or hostIPC — these break container
      isolation and expose the host network stack. Required for PCI-DSS 6.3 and
      RBI IT Security Framework network segmentation controls.
      Monitoring namespace is excluded because node-exporter legitimately needs
      hostNetwork and hostPID to collect host-level metrics.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: disallow-host-namespaces
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - falco
                - cert-manager
                - linkerd
                - linkerd-cni
                - monitoring
      validate:
        message: "hostNetwork, hostPID, and hostIPC must not be enabled."
        pattern:
          spec:
            =(hostNetwork): false
            =(hostPID): false
            =(hostIPC): false
