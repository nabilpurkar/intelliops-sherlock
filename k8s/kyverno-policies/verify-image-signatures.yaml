apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
  annotations:
    policies.kyverno.io/title: Verify Image Signatures
    policies.kyverno.io/category: Supply Chain Security / BFSI
    policies.kyverno.io/severity: critical
    policies.kyverno.io/description: >-
      Verifies Cosign keyless OIDC signatures on application images (SLSA /
      PCI-DSS 6.3.3). PREREQUISITE: Kyverno's service account must have IRSA
      with ECR read permissions so the webhook can look up signature artifacts.
      Without IRSA the webhook times out and blocks all pod creation in apps.
      Apply this policy ONLY after configuring Kyverno IRSA in Terraform.
      configure-stack.sh deletes this policy during bootstrap for that reason.
spec:
  validationFailureAction: Audit
  background: false
  rules:
    - name: verify-cosign-signature
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces:
                - apps
      verifyImages:
        - imageReferences:
            - "007066145518.dkr.ecr.us-east-1.amazonaws.com/intelliops-dev/*"
          attestors:
            - count: 1
              entries:
                - keyless:
                    subject: "https://github.com/InfrastructurePath/intelliops-sherlock/.github/workflows/*"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: https://rekor.sigstore.dev
          mutateDigest: false
          verifyDigest: false
          required: false
