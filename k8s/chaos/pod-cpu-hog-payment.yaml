---
# LitmusChaos 3.x — pod-cpu-hog against payment-service
# Stresses CPU to 90% for 60s to simulate a CPU runaway — triggers anomaly-detector alert.
# Expected outcome: SLO burn rate fires, ai-agent suggests horizontal scaling.
#
# Apply:  kubectl apply -f k8s/chaos/pod-cpu-hog-payment.yaml
# Watch:  kubectl get chaosengine pod-cpu-hog-payment -n apps -w
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: pod-cpu-hog-payment
  namespace: apps
  labels:
    scenario: performance
    target: payment-service
  annotations:
    litmuschaos.io/chaos: "true"
spec:
  appinfo:
    appns: apps
    applabel: "app=payment-service"
    appkind: deployment
  engineState: active
  chaosServiceAccount: litmus-admin
  monitoring: true
  jobCleanUpPolicy: retain
  experiments:
    - name: pod-cpu-hog
      spec:
        probe:
          - name: payment-service-health
            type: httpProbe
            httpProbe/inputs:
              url: "http://payment-service.apps.svc.cluster.local:8002/health"
              insecureSkipVerify: false
              method:
                get:
                  criteria: ==
                  responseCode: "200"
            mode: Continuous
            runProperties:
              probeTimeout: 5
              interval: 10
              retry: 3
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "60"
            - name: CPU_CORES
              value: "1"
            - name: CPU_LOAD
              value: "90"
            - name: PODS_AFFECTED_PERC
              value: "100"
