---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alert-correlator
  namespace: aiops-demo

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-correlator
  namespace: aiops-demo
  labels:
    app: alert-correlator
    team: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-correlator
  template:
    metadata:
      labels:
        app: alert-correlator
        team: platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: alert-correlator
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: alert-correlator
          image: 007066145518.dkr.ecr.us-east-1.amazonaws.com/intelliops-dev/alert-correlator:latest
          ports:
            - containerPort: 8080
          env:
            - name: ALERTMANAGER_URL
              valueFrom:
                configMapKeyRef:
                  name: aiops-config
                  key: ALERTMANAGER_URL
            - name: POLL_INTERVAL_SECONDS
              value: "300"
            - name: CORRELATION_WINDOW_SECONDS
              value: "300"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

---
apiVersion: v1
kind: Service
metadata:
  name: alert-correlator
  namespace: aiops-demo
  labels:
    app: alert-correlator
spec:
  selector:
    app: alert-correlator
  ports:
    - port: 8080
      targetPort: 8080
