---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-agent
  namespace: aiops-demo
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::007066145518:role/intelliops-dev-ai-agent-role"

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-agent
  namespace: apps
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, events]
    verbs: [get, list, delete]
  - apiGroups: [apps]
    resources: [deployments, deployments/scale]
    verbs: [get, list, patch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-agent
  namespace: apps
subjects:
  - kind: ServiceAccount
    name: ai-agent
    namespace: aiops-demo
roleRef:
  kind: Role
  name: ai-agent
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent
  namespace: aiops-demo
  labels:
    app: ai-agent
    team: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-agent
  template:
    metadata:
      labels:
        app: ai-agent
        team: platform
    spec:
      serviceAccountName: ai-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: ai-agent
          image: 007066145518.dkr.ecr.us-east-1.amazonaws.com/intelliops-dev/ai-agent:latest
          env:
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: BEDROCK_MODEL_ID
              value: anthropic.claude-sonnet-4-5
            - name: SQS_QUEUE_URL
              valueFrom:
                configMapKeyRef:
                  name: aiops-config
                  key: SQS_QUEUE_URL
            - name: ARGOCD_URL
              valueFrom:
                configMapKeyRef:
                  name: aiops-config
                  key: ARGOCD_URL
            - name: PROMETHEUS_URL
              valueFrom:
                configMapKeyRef:
                  name: aiops-config
                  key: PROMETHEUS_URL
            - name: LOKI_URL
              valueFrom:
                configMapKeyRef:
                  name: aiops-config
                  key: LOKI_URL
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: slack-webhook
                  key: SLACK_WEBHOOK_URL
            - name: ARGOCD_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: argocd-credentials
                  key: auth_token
                  optional: true
            - name: POLL_INTERVAL_SECONDS
              value: "30"
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]

---
apiVersion: v1
kind: Service
metadata:
  name: ai-agent
  namespace: aiops-demo
  labels:
    app: ai-agent
spec:
  selector:
    app: ai-agent
  ports:
    - port: 8080
      targetPort: 8080
