apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: aiops-demo
  labels:
    app: load-generator
    team: platform
spec:
  replicas: 1   # single instance is enough; scale up for more load
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      serviceAccountName: aiops-demo-sa
      containers:
        - name: load-generator
          image: your-registry/load-generator:latest   # ← replace
          imagePullPolicy: Always
          ports:
            - name: web-ui
              containerPort: 8089
              protocol: TCP
          env:
            - name: ORDER_SERVICE_URL
              value: "http://order-service:8000"
            - name: PAYMENT_SERVICE_URL
              value: "http://payment-service:8002"
            - name: INVENTORY_SERVICE_URL
              value: "http://inventory-service:8001"
            - name: LOCUST_USERS
              value: "20"
            - name: LOCUST_SPAWN_RATE
              value: "2"
          resources:
            requests:
              cpu:    "100m"
              memory: "128Mi"
            limits:
              cpu:    "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 8089
            initialDelaySeconds: 20
            periodSeconds:       30
            failureThreshold:    3
