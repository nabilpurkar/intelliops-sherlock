---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: intelliops-sherlock
  description: AIOps + DevSecOps demo platform — EKS-based microservices with full observability, security, and AI-driven auto-remediation
  annotations:
    github.com/project-slug: nabilpurkar/intelliops-sherlock
    backstage.io/techdocs-ref: dir:.
  tags:
    - aiops
    - devsecops
    - kubernetes
    - platform
spec:
  owner: platform-team
  domain: intelliops

---
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: intelliops
  description: IntelliOps platform domain
spec:
  owner: platform-team

---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: order-service
  description: Order management microservice — handles order lifecycle with circuit breaker and memory leak simulation
  annotations:
    github.com/project-slug: nabilpurkar/intelliops-order-service
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "8000"
  tags:
    - python
    - fastapi
    - microservice
  links:
    - url: https://apps.infrastructurepath.online/orders
      title: Live Service
spec:
  type: service
  lifecycle: production
  owner: platform-team
  system: intelliops-sherlock
  providesApis:
    - order-api

