repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: ^k8s/helm-charts/
      - id: end-of-file-fixer
        exclude: ^k8s/helm-charts/
      - id: check-yaml
        args: ["--allow-multiple-documents"]
        exclude: ^k8s/helm-charts/
      - id: check-json
        exclude: ^k8s/helm-charts/
      - id: detect-private-key
        exclude: ^k8s/helm-charts/
      - id: check-merge-conflict

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        args: ["--config=.gitleaks.toml"]
        exclude: ^k8s/helm-charts/

  # Hadolint — Dockerfile security linting (blocks on error-severity violations)
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        args: ["--failure-threshold", "error"]

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.1
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      # trivy — Terraform security analysis (replaces deprecated tfsec hook)
      - id: terraform_trivy
        args:
          - "--args=--severity=HIGH,CRITICAL"
          # Exceptions managed via .trivyignore:
          # AVD-AWS-0135: SQS CMK — AWS managed key sufficient for dev
          # AVD-AWS-0031: ECR mutable tags — CI overwrites tags by design
          # AVD-AWS-0040: EKS public endpoint — required for EC2 access
          # AVD-AWS-0164: subnet public IP — required for ALB nodes

  - repo: https://github.com/bridgecrewio/checkov
    rev: '3.2.379'
    hooks:
      - id: checkov
        exclude: ^k8s/helm-charts/
        args:
          - '--framework'
          - 'terraform,kubernetes'
          - '--skip-path'
          - 'k8s/helm-charts'
          - '--skip-check'
          - 'CKV_K8S_21,CKV_K8S_31,CKV_K8S_35,CKV_K8S_38,CKV_K8S_40,CKV_AWS_27,CKV2_AWS_73,CKV_K8S_43,CKV_K8S_14,CKV_K8S_8,CKV_K8S_9,CKV_K8S_22'
          # CKV_K8S_21: default SA — not applicable with IRSA
          # CKV_K8S_31: seccomp profile — runtime/default applied at node level
          # CKV_K8S_35: secrets as env — ESO/IRSA injects credentials, not raw Secret refs
          # CKV_K8S_38: SA token auto-mount — required for IRSA credential injection
          # CKV_K8S_40: UID > 10000 — UID 1000 is standard for Python/FastAPI workloads
          # CKV_AWS_27/CKV2_AWS_73: SQS SSE — AWS-managed key (alias/aws/sqs) sufficient for dev
          # CKV_K8S_43: image digest — CI uses git-SHA tags, not OCI digests
          # CKV_K8S_14: image tag — locust/aiops use :latest in dev; CI pins service images
          # CKV_K8S_8/9: liveness/readiness — aiops workloads use Bedrock; probes cause false restarts
          # CKV_K8S_22: read-only rootfs — aiops agent writes temp files at runtime

  # NOTE: Conftest/OPA K8s manifest validation runs in CI via _iac-scan.yml.
  # No pre-commit hook — conftest has no .pre-commit-hooks.yaml in its repo.
