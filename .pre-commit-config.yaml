repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: ^k8s/helm-charts/
      - id: end-of-file-fixer
        exclude: ^k8s/helm-charts/
      - id: check-yaml
        args: ["--allow-multiple-documents"]
        exclude: ^k8s/helm-charts/
      - id: check-json
        exclude: ^k8s/helm-charts/
      - id: detect-private-key
        exclude: ^k8s/helm-charts/
      - id: check-merge-conflict

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        args: ["--config=.gitleaks.toml"]
        exclude: ^k8s/helm-charts/

  # Hadolint — Dockerfile security linting (blocks on error-severity violations)
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        args: ["--failure-threshold", "error"]

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.1
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      # trivy — Terraform security analysis (replaces deprecated tfsec hook)
      - id: terraform_trivy
        args:
          - "--args=--severity=HIGH,CRITICAL"

  - repo: https://github.com/bridgecrewio/checkov
    rev: '3.2.379'
    hooks:
      - id: checkov
        args:
          - '--framework'
          - 'terraform,kubernetes'
          - '--skip-check'
          - 'CKV_K8S_21'   # default SA check not applicable with IRSA

  # NOTE: Conftest/OPA K8s manifest validation runs in CI via _iac-scan.yml.
  # No pre-commit hook — conftest has no .pre-commit-hooks.yaml in its repo.
