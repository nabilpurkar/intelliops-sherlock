name: CI — Platform

# Platform repo pipeline: secret scanning + SAST + SCA + SonarQube + IaC + unit tests.
# Service and AIOps builds run in their own repos and dispatch back here
# via repository_dispatch → _manifest-update.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  security-events: write

jobs:

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      services:  ${{ steps.filter.outputs.services }}
      k8s:       ${{ steps.filter.outputs.k8s }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            terraform:
              - 'terraform/**'
            services:
              - 'services/**'
            k8s:
              - 'k8s/**'
              - '.github/workflows/**'

  # ── Stage 1: Secret scanning (always, parallel) ───────────────────────────────
  gitleaks:
    uses: ./.github/workflows/_gitleaks.yml
    permissions:
      contents: read

  # ── Stage 2: SAST — Semgrep (always, after gitleaks) ─────────────────────────
  sast:
    needs: [gitleaks]
    uses: ./.github/workflows/_sast.yml
    secrets:
      defectdojo_api_key: ${{ secrets.DEFECTDOJO_API_KEY }}
    permissions:
      contents: read
      security-events: write

  # ── Stage 3a: Unit tests (when services/ changed) ─────────────────────────────
  unit-tests:
    needs: [detect-changes, gitleaks]
    if: needs.detect-changes.outputs.services == 'true'
    uses: ./.github/workflows/_unit-tests.yml
    permissions:
      contents: read

  # ── Stage 3b: SCA — Trivy + OWASP Dependency-Check (always) ─────────────────
  sca:
    needs: [gitleaks]
    uses: ./.github/workflows/_sca.yml
    secrets:
      defectdojo_api_key: ${{ secrets.DEFECTDOJO_API_KEY }}
    permissions:
      contents: read
      security-events: write

  # ── Stage 4: SonarQube code quality gate (after unit tests produce coverage) ──
  sonarqube:
    needs: [sast, sca]
    if: always() && needs.sast.result != 'failure'
    uses: ./.github/workflows/_sonarqube.yml
    secrets:
      sonar_token:        ${{ secrets.SONAR_TOKEN }}
      defectdojo_api_key: ${{ secrets.DEFECTDOJO_API_KEY }}
    permissions:
      contents: read

  # ── Stage 3c: IaC scan (when terraform/ changed) ─────────────────────────────
  iac-scan:
    needs: [detect-changes, gitleaks]
    if: needs.detect-changes.outputs.terraform == 'true'
    uses: ./.github/workflows/_iac-scan.yml
    secrets:
      defectdojo_api_key: ${{ secrets.DEFECTDOJO_API_KEY }}
      infracost_api_key: ${{ secrets.INFRACOST_API_KEY }}
    permissions:
      contents: read
      security-events: write
