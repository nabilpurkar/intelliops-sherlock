name: CI — Platform

# Platform repo pipeline:
#   - Secret scanning (always)
#   - IaC scan (when terraform/ changes)
#   - AIOps image build+push (when aiops/ changes, main branch only)
#
# Microservice builds run in their own repos and dispatch back here
# via repository_dispatch → _manifest-update.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  security-events: write

env:
  AWS_ACCOUNT_ID: "007066145518"
  AWS_REGION: us-east-1
  ROLE_ARN: arn:aws:iam::007066145518:role/github-actions-role

jobs:

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      aiops: ${{ steps.filter.outputs.aiops }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            terraform:
              - 'terraform/**'
            aiops:
              - 'aiops/**'

  # ── Stage 1: Secret scanning (always) ────────────────────────────────────────
  gitleaks:
    needs: [detect-changes]
    uses: ./.github/workflows/_gitleaks.yml
    permissions:
      contents: read

  # ── Stage 2: IaC scan (when terraform/ changed) ───────────────────────────────
  iac-scan:
    needs: [detect-changes, gitleaks]
    if: needs.detect-changes.outputs.terraform == 'true'
    uses: ./.github/workflows/_iac-scan.yml
    secrets:
      defectdojo_api_key: ${{ secrets.DEFECTDOJO_API_KEY }}
      infracost_api_key: ${{ secrets.INFRACOST_API_KEY }}
    permissions:
      contents: read
      security-events: write

  # ── Stage 3: AIOps image build + push (when aiops/ changed, main only) ────────
  build-aiops:
    needs: [detect-changes, gitleaks]
    if: needs.detect-changes.outputs.aiops == 'true' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_aiops-build-push.yml
    with:
      aws_account_id: "007066145518"
      aws_region: us-east-1
      role_arn: arn:aws:iam::007066145518:role/github-actions-role
      image_tag: ${{ github.sha }}
    permissions:
      id-token: write
      contents: read
      security-events: write
