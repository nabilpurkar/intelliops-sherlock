name: CI — Platform

# Platform repo pipeline: secret scanning + IaC security scan.
# Service and AIOps builds run in their own repos and dispatch back here
# via repository_dispatch → _manifest-update.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  security-events: write

jobs:

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            terraform:
              - 'terraform/**'

  # ── Stage 1: Secret scanning (always) ────────────────────────────────────────
  gitleaks:
    needs: [detect-changes]
    uses: ./.github/workflows/_gitleaks.yml
    permissions:
      contents: read

  # ── Stage 2: IaC scan (when terraform/ changed) ───────────────────────────────
  iac-scan:
    needs: [detect-changes, gitleaks]
    if: needs.detect-changes.outputs.terraform == 'true'
    uses: ./.github/workflows/_iac-scan.yml
    secrets:
      defectdojo_api_key: ${{ secrets.DEFECTDOJO_API_KEY }}
      infracost_api_key: ${{ secrets.INFRACOST_API_KEY }}
    permissions:
      contents: read
      security-events: write
