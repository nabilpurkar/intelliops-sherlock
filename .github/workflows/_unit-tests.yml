name: Unit Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service: [order-service, payment-service, inventory-service]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt

      - name: Install dependencies
        run: |
          pip install \
            -r services/${{ matrix.service }}/requirements.txt \
            -r services/${{ matrix.service }}/requirements-test.txt \
            pytest-cov

      - name: Run pytest with coverage
        working-directory: services/${{ matrix.service }}
        run: |
          pytest tests/ -v --tb=short \
            --cov=. --cov-report=xml:coverage.xml \
            --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}/coverage.xml
