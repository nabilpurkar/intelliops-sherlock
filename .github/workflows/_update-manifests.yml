name: Update K8s Manifests

on:
  workflow_call:
    inputs:
      service:
        description: Service name to update manifest for
        type: string
        required: true
      image_tag:
        description: New image tag (git SHA)
        type: string
        required: true
      aws_account_id:
        type: string
        required: false
        default: "007066145518"
      aws_region:
        type: string
        required: false
        default: us-east-1

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Update image tag in deployment manifest
        env:
          SERVICE: ${{ inputs.service }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          REGISTRY: ${{ inputs.aws_account_id }}.dkr.ecr.${{ inputs.aws_region }}.amazonaws.com
        run: |
          manifest="k8s/deployments/${SERVICE}.yaml"
          new_image="${REGISTRY}/intelliops-dev/${SERVICE}:${IMAGE_TAG}"

          sed -i "s|image: ${REGISTRY}/intelliops-dev/${SERVICE}:.*|image: ${new_image}|" "${manifest}"

          git diff --exit-code "${manifest}" && exit 0

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${manifest}"
          git commit -m "chore(deploy): update ${SERVICE} to ${IMAGE_TAG:0:7}"

          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin main && break
            echo "Push attempt ${attempt} failed, retrying..."
            sleep $((RANDOM % 5 + 2))
          done
