name: AIOps Build and Push

on:
  workflow_call:
    inputs:
      aws_region:
        type: string
        default: us-east-1
      aws_account_id:
        type: string
        required: true
      role_arn:
        type: string
        required: true
      image_tag:
        type: string
        required: true

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: anomaly-detector
            context: aiops/ml-models/anomaly-detection
          - service: forecaster
            context: aiops/ml-models/forecasting
          - service: alert-correlator
            context: aiops/ml-models/alert-correlation
          - service: ai-agent
            context: aiops/ai-agent

    env:
      REGISTRY: ${{ inputs.aws_account_id }}.dkr.ecr.${{ inputs.aws_region }}.amazonaws.com
      IMAGE_NAME: intelliops-dev/${{ matrix.service }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Trivy image scan (pre-push)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ${{ matrix.context }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          exit-code: 0
          ignore-unfixed: true

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-aiops-${{ matrix.service }}

      - name: Build and push
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=aiops-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=aiops-${{ matrix.service }}

      - name: Sign image with Cosign
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${{ steps.build-push.outputs.digest }}"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
