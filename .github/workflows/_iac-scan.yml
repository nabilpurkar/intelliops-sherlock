name: IaC Scan - Checkov + Infracost

on:
  workflow_call:
    secrets:
      defectdojo_api_key:
        required: false
      infracost_api_key:
        required: false

env:
  DEFECTDOJO_URL: https://defectdojo.infrastructurepath.online

permissions:
  contents: read
  security-events: write

jobs:
  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          framework: terraform
          output_format: sarif
          output_file_path: checkov.sarif
          soft_fail: true

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov.sarif
          category: checkov

      - name: Upload to DefectDojo
        if: always()
        env:
          DEFECTDOJO_API_KEY: ${{ secrets.defectdojo_api_key }}
        run: |
          [ -z "${DEFECTDOJO_API_KEY}" ] && exit 0
          curl -sf -X POST "${DEFECTDOJO_URL}/api/v2/import-scan/" \
            -H "Authorization: Token ${DEFECTDOJO_API_KEY}" \
            -F "scan_type=SARIF" \
            -F "file=@checkov.sarif" \
            -F "product_name=IntelliOps Sherlock" \
            -F "engagement_name=CI Pipeline - Checkov" \
            -F "auto_create_context=true" \
            -F "active=true" \
            -F "verified=false" \
            -F "branch_tag=${{ github.sha }}" || true

      - name: Infracost estimate (non-blocking)
        continue-on-error: true
        env:
          INFRACOST_API_KEY: ${{ secrets.infracost_api_key }}
        run: |
          [ -z "${INFRACOST_API_KEY}" ] && echo "INFRACOST_API_KEY not set — skipping cost estimate" && exit 0

          curl -fsSL https://raw.githubusercontent.com/infracost/infracost/master/scripts/install.sh | sh
          infracost configure set api_key "${INFRACOST_API_KEY}"

          infracost breakdown \
            --path terraform/environments/dev \
            --format json \
            --out-file infracost.json

          infracost output \
            --path infracost.json \
            --format github-comment \
            --out-file infracost-comment.md

          echo "### Infracost Estimate" >> "${GITHUB_STEP_SUMMARY}"
          cat infracost-comment.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Infracost report
        if: always() && hashFiles('infracost.json') != ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: infracost-report
          path: infracost.json
