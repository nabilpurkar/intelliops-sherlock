name: IaC Scan - Checkov

on:
  workflow_call:
    secrets:
      defectdojo_api_key:
        required: false

env:
  DEFECTDOJO_URL: https://defectdojo.infrastructurepath.online

permissions:
  contents: read
  security-events: write

jobs:
  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          framework: terraform
          output_format: sarif
          output_file_path: checkov.sarif
          soft_fail: true

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov.sarif
          category: checkov

      - name: Upload to DefectDojo
        if: always()
        env:
          DEFECTDOJO_API_KEY: ${{ secrets.defectdojo_api_key }}
        run: |
          [ -z "${DEFECTDOJO_API_KEY}" ] && exit 0
          curl -sf -X POST "${DEFECTDOJO_URL}/api/v2/import-scan/" \
            -H "Authorization: Token ${DEFECTDOJO_API_KEY}" \
            -F "scan_type=SARIF" \
            -F "file=@checkov.sarif" \
            -F "product_name=IntelliOps Sherlock" \
            -F "engagement_name=CI Pipeline - Checkov" \
            -F "auto_create_context=true" \
            -F "active=true" \
            -F "verified=false" \
            -F "branch_tag=${{ github.sha }}" || true
