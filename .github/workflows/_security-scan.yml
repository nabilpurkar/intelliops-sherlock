name: Security Scan

on:
  workflow_call:
    inputs:
      terraform_changed:
        description: Whether Terraform files changed (enables Checkov)
        type: boolean
        required: false
        default: false
    secrets:
      sonar_token:
        required: false
      defectdojo_api_key:
        required: false

env:
  DEFECTDOJO_URL: https://defectdojo.infrastructurepath.online

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep SAST
        run: |
          semgrep scan \
            --config=auto \
            --sarif \
            --output=semgrep.sarif \
            --exclude="**/.terraform/**" \
            . || true

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Upload to DefectDojo
        if: always()
        env:
          DEFECTDOJO_API_KEY: ${{ secrets.defectdojo_api_key }}
        run: |
          [ -z "${DEFECTDOJO_API_KEY}" ] && exit 0
          curl -sf -X POST "${DEFECTDOJO_URL}/api/v2/import-scan/" \
            -H "Authorization: Token ${DEFECTDOJO_API_KEY}" \
            -F "scan_type=SARIF" \
            -F "file=@semgrep.sarif" \
            -F "product_name=IntelliOps Sherlock" \
            -F "engagement_name=CI Pipeline - Semgrep" \
            -F "auto_create_context=true" \
            -F "active=true" \
            -F "verified=false" \
            -F "branch_tag=${{ github.sha }}" || true

  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          exit-code: 0

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Upload to DefectDojo
        if: always()
        env:
          DEFECTDOJO_API_KEY: ${{ secrets.defectdojo_api_key }}
        run: |
          [ -z "${DEFECTDOJO_API_KEY}" ] && exit 0
          curl -sf -X POST "${DEFECTDOJO_URL}/api/v2/import-scan/" \
            -H "Authorization: Token ${DEFECTDOJO_API_KEY}" \
            -F "scan_type=SARIF" \
            -F "file=@trivy-fs.sarif" \
            -F "product_name=IntelliOps Sherlock" \
            -F "engagement_name=CI Pipeline - Trivy FS" \
            -F "auto_create_context=true" \
            -F "active=true" \
            -F "verified=false" \
            -F "branch_tag=${{ github.sha }}" || true

  checkov:
    if: inputs.terraform_changed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          framework: terraform
          output_format: sarif
          output_file_path: checkov.sarif
          soft_fail: true

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov.sarif
          category: checkov

      - name: Upload to DefectDojo
        if: always()
        env:
          DEFECTDOJO_API_KEY: ${{ secrets.defectdojo_api_key }}
        run: |
          [ -z "${DEFECTDOJO_API_KEY}" ] && exit 0
          curl -sf -X POST "${DEFECTDOJO_URL}/api/v2/import-scan/" \
            -H "Authorization: Token ${DEFECTDOJO_API_KEY}" \
            -F "scan_type=SARIF" \
            -F "file=@checkov.sarif" \
            -F "product_name=IntelliOps Sherlock" \
            -F "engagement_name=CI Pipeline - Checkov" \
            -F "auto_create_context=true" \
            -F "active=true" \
            -F "verified=false" \
            -F "branch_tag=${{ github.sha }}" || true

  sonarqube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.sonar_token }}
          SONAR_HOST_URL: https://sonarqube.infrastructurepath.online

      - name: Quality Gate check
        id: quality-gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.sonar_token }}
          SONAR_HOST_URL: https://sonarqube.infrastructurepath.online

      - name: Export SonarQube issues and upload to DefectDojo
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.sonar_token }}
          DEFECTDOJO_API_KEY: ${{ secrets.defectdojo_api_key }}
        run: |
          [ -z "${SONAR_TOKEN}" ] || \
            curl -sf -u "${SONAR_TOKEN}:" \
              "https://sonarqube.infrastructurepath.online/api/issues/search?componentKeys=intelliops-sherlock&ps=500&resolved=false" \
              -o sonar-issues.json || true
          [ -z "${DEFECTDOJO_API_KEY}" ] && exit 0
          [ -f sonar-issues.json ] || exit 0
          curl -sf -X POST "${DEFECTDOJO_URL}/api/v2/import-scan/" \
            -H "Authorization: Token ${DEFECTDOJO_API_KEY}" \
            -F "scan_type=SonarQube Scan" \
            -F "file=@sonar-issues.json" \
            -F "product_name=IntelliOps Sherlock" \
            -F "engagement_name=CI Pipeline - SonarQube" \
            -F "auto_create_context=true" \
            -F "active=true" \
            -F "verified=false" \
            -F "branch_tag=${{ github.sha }}" || true
