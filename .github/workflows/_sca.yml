name: SCA - Dependency Scanning

on:
  workflow_call:
    secrets:
      defectdojo_api_key:
        required: false

env:
  DEFECTDOJO_URL: https://defectdojo.infrastructurepath.online

permissions:
  contents: read
  security-events: write

jobs:
  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          exit-code: 1          # BLOCKING — fails pipeline on CRITICAL/HIGH findings
          ignore-unfixed: true

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Upload to DefectDojo
        if: always()
        env:
          DEFECTDOJO_API_KEY: ${{ secrets.defectdojo_api_key }}
        run: |
          [ -z "${DEFECTDOJO_API_KEY}" ] && exit 0
          curl -sf -X POST "${DEFECTDOJO_URL}/api/v2/import-scan/" \
            -H "Authorization: Token ${DEFECTDOJO_API_KEY}" \
            -F "scan_type=SARIF" \
            -F "file=@trivy-fs.sarif" \
            -F "product_name=IntelliOps Sherlock" \
            -F "engagement_name=CI Pipeline - Trivy FS" \
            -F "auto_create_context=true" \
            -F "active=true" \
            -F "verified=false" \
            -F "branch_tag=${{ github.sha }}" || true

  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: intelliops-sherlock
          path: services
          format: ALL
          out: dependency-check-report
          args: >-
            --enableRetired
            --failOnCVSS 7

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: dependency-check-report/dependency-check-report.sarif
          category: dependency-check

      - name: Upload to DefectDojo
        if: always()
        env:
          DEFECTDOJO_API_KEY: ${{ secrets.defectdojo_api_key }}
        run: |
          [ -z "${DEFECTDOJO_API_KEY}" ] && exit 0
          [ -f dependency-check-report/dependency-check-report.xml ] || exit 0
          curl -sf -X POST "${DEFECTDOJO_URL}/api/v2/import-scan/" \
            -H "Authorization: Token ${DEFECTDOJO_API_KEY}" \
            -F "scan_type=Dependency Check Scan" \
            -F "file=@dependency-check-report/dependency-check-report.xml" \
            -F "product_name=IntelliOps Sherlock" \
            -F "engagement_name=CI Pipeline - OWASP Dependency Check" \
            -F "auto_create_context=true" \
            -F "active=true" \
            -F "verified=false" \
            -F "branch_tag=${{ github.sha }}" || true
