name: Docker Build and Push

on:
  workflow_call:
    inputs:
      service:
        description: Service name — must match services/<service>/ directory
        type: string
        required: true
      aws_region:
        type: string
        required: false
        default: us-east-1
      aws_account_id:
        type: string
        required: true
      role_arn:
        description: IAM role ARN for OIDC authentication
        type: string
        required: true
      image_tag:
        description: Docker image tag (git SHA)
        type: string
        required: true
    secrets:
      defectdojo_api_key:
        required: false

env:
  DEFECTDOJO_URL: https://defectdojo.infrastructurepath.online

permissions:
  id-token: write
  contents: read
  security-events: write
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ inputs.aws_account_id }}.dkr.ecr.${{ inputs.aws_region }}.amazonaws.com
      IMAGE_NAME: intelliops-dev/${{ inputs.service }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Build image locally for scanning
        uses: docker/build-push-action@v6
        with:
          context: services/${{ inputs.service }}
          platforms: linux/amd64
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan-${{ inputs.image_tag }}
          cache-from: type=gha,scope=${{ inputs.service }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan-${{ inputs.image_tag }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: 1

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-${{ inputs.service }}

      - name: Upload Trivy image scan to DefectDojo
        if: always()
        env:
          DEFECTDOJO_API_KEY: ${{ secrets.defectdojo_api_key }}
        run: |
          [ -z "${DEFECTDOJO_API_KEY}" ] && exit 0
          curl -sf -X POST "${DEFECTDOJO_URL}/api/v2/import-scan/" \
            -H "Authorization: Token ${DEFECTDOJO_API_KEY}" \
            -F "scan_type=SARIF" \
            -F "file=@trivy-image.sarif" \
            -F "product_name=IntelliOps Sherlock" \
            -F "engagement_name=CI Pipeline - Trivy Image (${{ inputs.service }})" \
            -F "auto_create_context=true" \
            -F "active=true" \
            -F "verified=false" \
            -F "branch_tag=${{ github.sha }}" || true

      - name: Build and push multi-platform image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: services/${{ inputs.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}

      - name: Sign image with Cosign (keyless via GitHub OIDC)
        run: |
          IMAGE_REF="${REGISTRY}/${IMAGE_NAME}@${{ steps.build-push.outputs.digest }}"
          cosign sign --yes "${IMAGE_REF}"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
